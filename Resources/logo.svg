<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="240" height="52" viewBox="0 0 240 52">
<!-- ==========================================================================
     Yellowcoat — PLACEHOLDER BRAND MARK (240 x 52)
     Drawn at 26,16 in the 640x480 panel, scaled to fit and centred.
     Swap this file for your own mark. Anything wider than 240x52 will be
     letterboxed rather than cropped.
     ========================================================================== -->

<g id="mark">
  <rect x="0" y="6" width="40" height="40" fill="#b24a28"/>
  <path d="M10 16 L30 26 L10 36 Z" fill="#d8cfb8"/>
  <line x1="30" y1="26" x2="38" y2="26" stroke="#d8cfb8" stroke-width="3"/>
</g>

<g id="wordmark" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
